plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    //id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '7'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.7'
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
  if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
android {
    namespace "com.afrotok.afrotok"
    testNamespace = "com.afrotok.afrotok"
    compileSdkVersion 36
    ndkVersion "28.0.13004108"


    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }

        }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true

    }

    kotlinOptions {
        jvmTarget = '1.8'
    }


    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }


    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.afrotok.afrotok"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // ✅ Active le MultiDex
        multiDexEnabled true
//        minSdk = flutter.minSdkVersion
//        targetSdk = flutter.targetSdkVersion
//        versionCode = flutter.versionCode
//        versionName = flutter.versionName
        externalNativeBuild {
            cmake {
                // ✅ Force l'alignement ELF 16K
                arguments "-DANDROID_ALIGNMENT=16"
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

    }
    packagingOptions {
        jniLibs {
            // ✅ Désactive le legacy packaging pour l'alignement 16K
            useLegacyPackaging = false
        }
        pickFirst "lib/arm64-v8a/libaosl.so"
        pickFirst "lib/armeabi-v7a/libaosl.so"
        // Supprimez le bloc jniLibs.excludes ou déplacez-le ici si nécessaire
        excludes += [
                "**/librive_text.so",  // ✅ Exclut explicitement
                "**/librive.so",
                "lib/x86/**",
                "lib/x86_64/**"
        ]
    }
    signingConfigs {
               release {
                       keyAlias keystoreProperties['keyAlias']
                       keyPassword keystoreProperties['keyPassword']
                       storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                   }
          }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
//            ndk {
//                debugSymbolLevel 'NONE'
//            }
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
//            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'r8-missing-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}
//apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
dependencies {
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.10.0')


    // Appodeal (stack_appodeal_flutter 4.3.1, SDK 4.3.0) : depuis la 4.1.0 le plugin n'embarque que « core » + « iab » ; les adaptateurs des réseaux se
    // déclarent ici, aux versions EXACTES du README du plugin (sans eux : « Requests = 0 » dans Appodeal). Réseaux retenus : ceux qui servent des
    // bannières. Exclus : Mintegral, Amazon, VK/MyTarget (dépôts Maven supplémentaires). Pour changer la liste : générateur de dépendances Appodeal.
    implementation("com.appodeal.ads.sdk.adapters:admob:25.2.0.0")
    implementation("com.appodeal.ads.sdk.adapters:applovin:13.6.3.0")
    implementation("com.appodeal.ads.sdk.adapters:bidon:0.14.0.0")   // requis par l'adaptateur AdMob (sinon R8 : « Missing class org.bidon.sdk... »)
    implementation("com.appodeal.ads.sdk.adapters:bidmachine:3.7.1.0")
    implementation("com.appodeal.ads.sdk.adapters:bigo_ads:5.9.0.0")
    implementation("com.appodeal.ads.sdk.adapters:dt_exchange:8.4.6.0")
    implementation("com.appodeal.ads.sdk.adapters:inmobi:11.3.0.0")
    implementation("com.appodeal.ads.sdk.adapters:ironsource:9.4.4.0")
    implementation("com.appodeal.ads.sdk.adapters:unity_ads:4.17.0.0")
    // Réseaux supplémentaires (plus de réseaux interrogés = plus de chances de remplissage des bannières). Mêmes versions que le README du plugin.
    // À activer aussi dans le tableau de bord Appodeal (onglets Banners / MREC). Toujours exclus : Mintegral, VK/MyTarget (dépôts Maven en plus), Amazon.
    implementation("com.appodeal.ads.sdk.adapters:meta:6.21.0.0")
    implementation("com.appodeal.ads.sdk.adapters:vungle:7.7.4.0")
    implementation("com.appodeal.ads.sdk.adapters:chartboost:9.10.2.0")
    implementation("com.appodeal.ads.sdk.adapters:moloco:4.3.1.0")
    implementation("com.appodeal.ads.sdk.adapters:yandex:7.17.0.0")
    implementation("com.appodeal.ads.sdk.adapters:startio:5.2.4.0")
    implementation("com.appodeal.ads.sdk.adapters:smaato:22.7.2.0")
    implementation("com.appodeal.ads.sdk.adapters:pubmatic:4.10.0.0")
    implementation("com.appodeal.ads.sdk.adapters:mobilefuse:1.11.0.0")
    implementation("com.appodeal.ads.sdk.adapters:ogury:6.2.0.0")
    implementation("com.appodeal.ads.sdk.adapters:taurusx:1.12.2.0")
    implementation("com.appodeal.ads.sdk.adapters:verve:3.7.1.0")

    implementation("androidx.multidex:multidex:2.0.1")

    // TODO: Add the dependencies for Firebase products you want to use
    // When using the BoM, don't specify versions in Firebase dependencies
    implementation 'com.google.firebase:firebase-analytics'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
//    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.google.firebase:firebase-auth-ktx'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

