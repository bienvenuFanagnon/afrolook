plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    //id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '7'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.7'
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
  if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
android {
    namespace "com.afrotok.afrotok"
    testNamespace = "com.afrotok.afrotok"
    compileSdkVersion 36
    ndkVersion "28.0.13004108"


    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }

        }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true

    }

    kotlinOptions {
        jvmTarget = '1.8'
    }


    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }


    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.afrotok.afrotok"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // ✅ Active le MultiDex
        multiDexEnabled true
//        minSdk = flutter.minSdkVersion
//        targetSdk = flutter.targetSdkVersion
//        versionCode = flutter.versionCode
//        versionName = flutter.versionName
        externalNativeBuild {
            cmake {
                // ✅ Force l'alignement ELF 16K
                arguments "-DANDROID_ALIGNMENT=16"
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
            // Essais sur émulateur x86_64 : ORG_GRADLE_PROJECT_withX86=true (jamais pour les versions publiées)
            if (project.hasProperty('withX86')) {
                abiFilters "x86_64"
            }
        }

    }
    packagingOptions {
        jniLibs {
            // ✅ Désactive le legacy packaging pour l'alignement 16K
            useLegacyPackaging = false
        }
        pickFirst "lib/arm64-v8a/libaosl.so"
        pickFirst "lib/armeabi-v7a/libaosl.so"
        // Supprimez le bloc jniLibs.excludes ou déplacez-le ici si nécessaire
        excludes += [
                "**/librive_text.so",  // ✅ Exclut explicitement
                "**/librive.so"
        ]
        // Allègement (09/11/2026) : extensions d'Agora que l'application n'utilise PAS (l'application n'emploie d'Agora que le live : audio, vidéo, partage d'écran,
        // et la beauté vidéo de base `setBeautyEffectOptions`, qui vient de libagora_clear_vision_extension.so : elle RESTE). Méthode et tableau : documentation d'Agora
        // « App size optimization » (Flutter). Si une fonction d'Agora est ajoutée plus tard (audio spatial, fond virtuel, voix modifiée…), retirer la ligne correspondante.
        excludes += [
                "**/libagora_lip_sync_extension.so",            // synchronisation labiale d'avatars (environ 5,7 Mo par architecture)
                "**/libagora_spatial_audio_extension.so",       // audio spatial (3,1 Mo)
                "**/libagora_segmentation_extension.so",        // fond virtuel (1,7 Mo)
                "**/libagora_face_capture_extension.so",        // capture d'expressions pour avatars (1,4 Mo)
                "**/libagora_audio_beauty_extension.so",        // voix modifiée / effets de voix (0,8 Mo)
                "**/libagora_content_inspect_extension.so",     // inspection de captures d'écran (1,1 Mo)
                "**/libagora_video_av1_encoder_extension.so",   // encodage AV1 (0,7 Mo)
                "**/libagora_video_av1_decoder_extension.so",   // décodage AV1 (0,5 Mo)
                "**/libagora_video_quality_analyzer_extension.so" // score de qualité vidéo (0,6 Mo)
        ]
        if (!project.hasProperty('withX86')) {
            excludes += ["lib/x86/**", "lib/x86_64/**"]
        }
    }
    signingConfigs {
               release {
                       keyAlias keystoreProperties['keyAlias']
                       keyPassword keystoreProperties['keyPassword']
                       storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                   }
          }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
//            ndk {
//                debugSymbolLevel 'NONE'
//            }
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
//            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'r8-missing-rules.pro'
            // Essais de vitesse sur le téléphone du propriétaire : -PdebugSignRelease=true signe avec la clé de TEST (l'application s'installe par-dessus la version de test et garde la session). Jamais pour une version publiée.
            signingConfig project.hasProperty('debugSignRelease') ? signingConfigs.debug : signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}
//apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
dependencies {
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.10.0')

    // Mur de tâches (Tapjoy) : le SDK doit aussi être déclaré ici (le plugin tapjoy_offerwall 14.6.0 ne l'expose pas à l'application)
    implementation 'com.tapjoy:tapjoy-android-sdk:14.6.0'


    // Appodeal (stack_appodeal_flutter 4.3.1, SDK 4.3.0) : depuis la 4.1.0 le plugin n'embarque que « core » + « iab » ; les adaptateurs des réseaux se
    // déclarent ici, aux versions EXACTES du README du plugin (sans eux : « Requests = 0 » dans Appodeal). Réseaux retenus : ceux qui servent des
    // bannières. Exclus : Mintegral, Amazon, VK/MyTarget (dépôts Maven supplémentaires). Pour changer la liste : générateur de dépendances Appodeal.
    implementation("com.appodeal.ads.sdk.adapters:admob:25.2.0.0")
    implementation("com.appodeal.ads.sdk.adapters:applovin:13.6.3.0")
    implementation("com.appodeal.ads.sdk.adapters:bidon:0.14.0.0")   // requis par l'adaptateur AdMob (sinon R8 : « Missing class org.bidon.sdk... »)
    implementation("com.appodeal.ads.sdk.adapters:bidmachine:3.7.1.0")
    implementation("com.appodeal.ads.sdk.adapters:dt_exchange:8.4.6.0")
    implementation("com.appodeal.ads.sdk.adapters:inmobi:11.3.0.0")
    implementation("com.appodeal.ads.sdk.adapters:unity_ads:4.17.0.0")
    // Allégé le 07/11/2026 (taille de l'app) : Bigo, IronSource, Vungle, Yandex, Chartboost, Moloco, Start.io et Smaato retirés (faible intérêt pour des bannières en Afrique).
    // Réseaux supplémentaires (plus de réseaux interrogés = plus de chances de remplissage des bannières). Mêmes versions que le README du plugin.
    // À activer aussi dans le tableau de bord Appodeal (onglets Banners / MREC). Toujours exclus : Mintegral, VK/MyTarget (dépôts Maven en plus), Amazon.
    implementation("com.appodeal.ads.sdk.adapters:meta:6.21.0.0")
    implementation("com.appodeal.ads.sdk.adapters:pubmatic:4.10.0.0")
    implementation("com.appodeal.ads.sdk.adapters:mobilefuse:1.11.0.0")
    implementation("com.appodeal.ads.sdk.adapters:ogury:6.2.0.0")
    implementation("com.appodeal.ads.sdk.adapters:taurusx:1.12.2.0")
    implementation("com.appodeal.ads.sdk.adapters:verve:3.7.1.0")

    implementation("androidx.multidex:multidex:2.0.1")

    // TODO: Add the dependencies for Firebase products you want to use
    // When using the BoM, don't specify versions in Firebase dependencies
    implementation 'com.google.firebase:firebase-analytics'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
//    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.google.firebase:firebase-auth-ktx'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Add the dependencies for any other desired Firebase products
    implementation 'androidx.window:window:1.3.0'
    // Moteur maison d'effets de visage (gratuit) : suivi du visage MediaPipe (478 points, sur le téléphone) + CameraX + OpenGL
    implementation 'com.google.mediapipe:tasks-vision:0.10.26'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    // Filtres de visage (photo) : ML Kit en version non groupée = modèle fourni par les services Google Play (quasi 0 Mo ajouté)
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.window:window-java:1.3.0'


