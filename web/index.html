<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ Titre & Description -->
  <title>Afrolook - Le réseau social africain des créateurs</title>
  <meta name="description" content="Afrolook est le réseau social africain qui met en valeur les créateurs de contenus. Publie des vidéos payantes, fais des lives, et monétise ton audience depuis l'Afrique.">

  <!-- ✅ SEO -->
  <meta name="keywords" content="Afrolook, réseau social africain, créateurs africains, contenu payant, live, monétisation Afrique, afro influenceur">
  <meta name="author" content="Afrolook">
  <!-- L'application web vit sous /app/ ; le site (référencé) est à la racine -->
  <meta name="robots" content="noindex">

  <!-- ✅ Base href pour Flutter -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- ✅ Favicon et icônes -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- ✅ iOS Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Afrolook">

  <!-- ✅ Open Graph (Facebook / WhatsApp / LinkedIn) -->
  <meta property="og:title" content="Afrolook - Le réseau social africain des créateurs">
  <meta property="og:description" content="Publie, vends, fais des lives et monétise ton audience en Afrique avec Afrolook. Rejoins la révolution des créateurs africains.">
  <meta property="og:image" content="https://afrolooki.web.app/icons/Icon-maskable-512.png">
  <meta property="og:url" content="https://afrolooki.web.app/">
  <meta property="og:type" content="website">

  <!-- ✅ Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Afrolook - Réseau Social Africain">
  <meta name="twitter:description" content="Rejoins Afrolook pour publier, vendre tes contenus, faire des lives et monétiser ton audience en Afrique.">
  <meta name="twitter:image" content="https://afrolooki.web.app/icons/Icon-maskable-512.png">

  <!-- ✅ Script Flutter -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <!-- Écran d'attente : la première ouverture télécharge l'application (plusieurs Mo) ; sans lui la page reste blanche. Retiré dès que Flutter a dessiné sa première image. -->
  <style>
    #afl-splash { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center;
      background: radial-gradient(120% 80% at 50% 0%, #17A05A 0%, #0F7B43 45%, #0B5A33 100%); color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; transition: opacity .35s ease; }
    #afl-splash.afl-out { opacity: 0; pointer-events: none; }
    #afl-splash img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 14px 34px rgba(0, 0, 0, .35); }
    #afl-splash .afl-nom { font-size: 30px; font-weight: 800; letter-spacing: .3px; }
    #afl-splash .afl-barre { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .25); overflow: hidden; }
    #afl-splash .afl-barre i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #fff; animation: afl-glisse 1.3s ease-in-out infinite; }
    #afl-splash .afl-msg { font-size: 16px; line-height: 1.4; opacity: .92; max-width: 320px; min-height: 2.8em; }
    @keyframes afl-glisse { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #afl-splash .afl-barre i { animation: none; width: 100%; opacity: .7; } }
  </style>
  <div id="afl-splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="afl-nom">Afrolook</div>
    <div class="afl-barre"><i></i></div>
    <div class="afl-msg" id="afl-msg">Chargement…<br>La première ouverture prend quelques secondes de plus, les suivantes sont plus rapides.</div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('afl-splash'), msg = document.getElementById('afl-msg'), done = false;
      function fin() { if (done) return; done = true; splash.classList.add('afl-out'); setTimeout(function () { splash.remove(); }, 450); }
      window.addEventListener('flutter-first-frame', fin);
      setTimeout(function () { if (!done) msg.innerHTML = 'Encore quelques secondes…<br>Ta connexion est un peu lente, ça arrive.'; }, 12000);
      setTimeout(function () { if (!done) msg.innerHTML = 'Toujours en chargement.<br>Si rien ne s\'affiche, recharge la page.'; }, 45000);
      setTimeout(fin, 240000);   // filet de sécurité : l'écran d'attente ne reste jamais indéfiniment
    })();
  </script>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      // Empêche la bannière automatique de s'afficher tout de suite
      e.preventDefault();
      deferredPrompt = e;

      console.log("PWA: L'app peut être installée.");

      // Optionnel : Tu peux envoyer un message à Flutter ici pour afficher ton propre bouton
      // window.parent.postMessage("pwa-install-available", "*");
    });

    // Fonction que tu pourras appeler depuis Flutter plus tard si tu veux
    window.installPWA = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Utilisateur a répondu : ${outcome}`);
        deferredPrompt = null;
      } else {
        alert("L'application est déjà installée ou votre navigateur ne supporte pas l'installation automatique.");
      }
    };
  </script>
</body>
</html>
