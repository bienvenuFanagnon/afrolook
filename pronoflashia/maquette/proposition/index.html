<title>PronoFlash IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept : maquette de revue (onglets) qui contient un faux site en mode sombre, bascule téléphone / ordinateur */
:root{
  --bg:#080D18; --s1:#0F1626; --s2:#141D31; --line:#22304D;
  --flash:#FFD60A; --ok:#2BD576; --ko:#FF5A5F; --cy:#38D6F5; --afl:#1FAA59;
  --tx:#EEF2FF; --mut:#8E9AB8;
  --ink:#080D18;
  --f-d:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-b:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f-b);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-d);font-weight:700;letter-spacing:.2px;text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--flash);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- barre de la maquette ---------- */
.mq{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(8,13,24,.94);backdrop-filter:blur(8px);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.mq-in{max-width:1240px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mq-t{font-family:var(--f-d);font-weight:800;font-size:20px;white-space:nowrap}
.mq-t b{color:var(--flash)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:1px solid transparent;border-radius:8px;padding:7px 12px;color:var(--mut);white-space:nowrap;font-weight:500;font-size:14px}
.tab[aria-selected=true]{background:var(--s2);border-color:var(--line);color:var(--tx)}
.tab:hover{color:var(--tx)}
.panel{max-width:1240px;margin:22px auto 0}
.panel[hidden]{display:none}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--s1)}
.seg button{background:none;border:0;padding:7px 14px;color:var(--mut);font-size:13px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--flash);color:var(--ink);font-weight:600}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);cursor:pointer}
.chk input{accent-color:var(--flash);width:16px;height:16px}
.note{font-size:13px;color:var(--mut)}

/* ---------- le faux site ---------- */
.frame{container:site/inline-size;margin-inline:auto;width:100%;max-width:1200px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);transition:max-width .25s}
.frame[data-dev=phone]{max-width:390px}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--s1)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-weight:800;font-size:24px;letter-spacing:.3px;text-decoration:none;white-space:nowrap}
.bolt{width:28px;height:28px;border-radius:7px;background:var(--flash);color:var(--ink);display:grid;place-items:center;font-size:17px;font-weight:800;transform:skew(-6deg)}
.logo em{font-style:normal;color:var(--flash)}
.logo small{font-size:13px;font-weight:700;background:var(--s2);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--cy);margin-left:2px;letter-spacing:.5px}
.hnav{display:none;gap:4px;margin-left:12px}
.hnav a{padding:6px 12px;border-radius:7px;color:var(--mut);text-decoration:none;font-weight:500;font-size:14px}
.hnav a.on{color:var(--tx);background:var(--s2)}
.hnav a i{font-style:normal;font-size:10px;margin-left:5px;color:var(--cy);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.hsp{flex:1}
.lang{font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:none}
.lang b{color:var(--tx)}

.sport{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.sport::-webkit-scrollbar{display:none}
.sp{display:flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:14px;font-weight:600;white-space:nowrap}
.sp.on{background:var(--flash);border-color:var(--flash);color:var(--ink)}
.sp.off{color:var(--mut);font-weight:500}
.sp.off i{font-style:normal;font-size:10px;color:var(--cy)}
.days{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dy{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mut);font-size:13px;font-weight:500;white-space:nowrap}
.dy.on{color:var(--tx);background:var(--s2);border-color:#35487a}
.lgs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.lgs::-webkit-scrollbar{display:none}
.lg{padding:4px 10px;border-radius:6px;background:var(--s1);border:1px solid var(--line);color:var(--mut);font-size:12px;white-space:nowrap}
.lg.on{color:var(--cy);border-color:var(--cy)}

.main{display:grid;gap:16px;padding:16px}
.col{min-width:0;display:flex;flex-direction:column;gap:10px}
.side{display:none;flex-direction:column;gap:14px}
.sticky{position:sticky;top:64px;display:flex;flex-direction:column;gap:14px}

.hero{display:flex;flex-direction:column;gap:6px;padding:4px 0 2px}
.hero h1{font-size:30px;line-height:1.05;font-weight:800;text-transform:uppercase}
.hero h1 b{color:var(--flash)}
.hero p{color:var(--mut);font-size:14px;max-width:62ch}

.top3{display:grid;gap:8px;grid-template-columns:1fr}
.t3{border:1px solid #4a4210;background:linear-gradient(135deg,#1c1a08,var(--s1));border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none}
.t3 small{color:var(--mut);font-size:11px;display:block}
.t3 b{font-family:var(--f-d);font-size:19px;font-weight:700;display:block;line-height:1.15}
.t3 .pk{color:var(--flash);font-family:var(--f-d);font-weight:700;font-size:17px;text-align:right}
.t3 .pk span{display:block;color:var(--ok);font-size:13px}
.lbl{font-family:var(--f-d);font-weight:700;font-size:15px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.lbl::before{content:"";width:18px;height:3px;background:var(--flash);border-radius:2px}

/* carte de match */
.mc{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;position:relative}
.mc:hover{border-color:#35487a}
.mc .hd{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.mc .hd b{color:var(--tx);font-family:var(--f-d);font-size:16px;font-weight:700;margin-right:8px}
.tm{display:flex;flex-direction:column;gap:7px;grid-column:1/-1}
.tr{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.tr .fm{margin-left:auto;display:none;gap:3px}
.fm i{font-style:normal;width:17px;height:17px;border-radius:4px;font-size:10px;font-weight:700;display:grid;place-items:center;color:var(--ink)}
.fm .V{background:var(--ok)}.fm .N{background:#9aa6c4}.fm .D{background:var(--ko)}
.cr{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none;letter-spacing:.3px;border:2px solid rgba(255,255,255,.15)}
.pr{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:9px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.pk1{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;display:block}
.pk1 + b{font-family:var(--f-d);font-weight:800;font-size:23px;color:var(--flash);line-height:1.05;display:block}
.cf{text-align:right;font-family:var(--f-d);font-weight:800;font-size:26px;color:var(--ok);line-height:1}
.cf small{display:block;font-family:var(--f-b);font-size:10px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.bars{grid-column:1/-1;display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px}
.bars i{display:block}
.bl{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.sc{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.sc span{font-size:11px;color:var(--cy);border:1px solid #1c4a58;background:#0b1e27;border-radius:6px;padding:2px 8px}

/* publicités */
.ad{border:1px dashed #3a4a73;border-radius:10px;background:repeating-linear-gradient(135deg,#0d1424 0 10px,#0f1729 10px 20px);color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-size:11px;position:relative;padding:6px}
.ad b{font-size:12px;color:#b7c2e0;font-weight:600}
.ad::before{content:"PUB";position:absolute;top:4px;left:7px;font-size:9px;letter-spacing:1px;color:#6c7aa0}
.ad.ban{min-height:50px}
.ad.nat{min-height:84px;flex-direction:row;gap:12px}
.ad.rect{min-height:250px}
.ad.tall{min-height:420px}
.ad.dk{display:none}
.hideads .ad:not(.afl),.hideads .afl,.hideads .stk,.hideads .sbar{display:none!important}
.hl .ad,.hl .afl{box-shadow:0 0 0 2px var(--flash)}
.tagp{position:absolute;top:-8px;right:10px;background:var(--flash);color:var(--ink);font-weight:700;font-size:10px;border-radius:5px;padding:1px 6px;display:none;z-index:2}
.hl .tagp{display:block}

.afl{display:grid;grid-template-columns:76px 1fr;border:1px solid #17673a;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,#0b2417,#0F1626);text-decoration:none;position:relative}
.afl .im{background-size:cover;background-position:center;min-height:96px}
.afl .bd{padding:10px 12px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.afl .bg{font-size:10px;font-weight:700;letter-spacing:1px;background:var(--afl);color:#fff;border-radius:4px;padding:1px 6px;display:flex;gap:5px;align-items:center}
.afl .bg img{width:12px;height:12px;border-radius:3px}
.afl p{font-family:var(--f-d);font-weight:700;font-size:19px;line-height:1.1}
.afl .cta{font-size:12px;font-weight:600;background:var(--afl);color:#fff;border-radius:7px;padding:5px 11px}
.afl .sp2{position:absolute;top:5px;right:8px;font-size:9px;color:#6fae8a}

.stk{position:sticky;bottom:0;z-index:5;display:flex;justify-content:center;padding:6px;background:linear-gradient(transparent,var(--bg) 40%)}
.stk .ad{width:320px;max-width:100%;height:50px;min-height:50px;padding-right:30px}
.stk button{position:absolute;right:calc(50% - 158px);top:10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--s2);font-size:11px;line-height:1;z-index:3}
.sbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(70px,env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 24px));z-index:40;border:1px dashed #3a4a73;background:var(--s2);border-radius:12px;padding:10px 32px 10px 12px;font-size:12px;color:#b7c2e0;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.sbar b{display:block;color:var(--tx);font-size:13px}
.sbar button{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--s1);font-size:11px}

.box{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px}
.bil{display:flex;align-items:center;gap:14px}
.bil .big{font-family:var(--f-d);font-weight:800;font-size:46px;color:var(--ok);line-height:1;white-space:nowrap}
.bil p{font-size:13px;color:var(--mut)}
.bil a{color:var(--cy);font-size:13px}

.ftr{border-top:1px solid var(--line);background:var(--s1);padding:18px 16px;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--mut)}
.ftr nav{display:flex;flex-wrap:wrap;gap:6px 14px}
.ftr .r18{display:flex;gap:8px;align-items:center;color:var(--tx);font-weight:600;font-size:13px}
.ftr .r18 b{border:2px solid var(--ko);color:var(--ko);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:11px}

@container site (min-width:560px){
  .top3{grid-template-columns:repeat(3,1fr)}
  .tr .fm{display:flex}
  .mc{grid-template-columns:1fr 1fr;gap:8px 22px;align-items:center}
  .mc .hd{grid-column:1/-1}
  .tm{grid-column:1;grid-row:2/6;display:flex;flex-direction:column;gap:12px;align-self:center}
  .tr{font-size:17px}
  .pr{grid-column:2;border-top:0;padding-top:0}
  .bars,.bl,.sc{grid-column:2}
  .afl{grid-template-columns:120px 1fr}
  .stk{display:none}
}
@container site (min-width:860px){
  .main{grid-template-columns:minmax(0,1fr) 320px;gap:22px;padding:20px}
  .side{display:flex}
  .hnav{display:flex}
  .ad.dk{display:flex}
  .ad.ban{min-height:90px}
  .ad.mo{display:none}
  .hero h1{font-size:40px}
}

/* fiche match */
.vd{background:linear-gradient(160deg,#241f06,var(--s1) 60%);border:1px solid #5a4e0a;border-radius:14px;padding:18px;display:grid;gap:14px}
.vd .tt{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-family:var(--f-d);font-weight:700;font-size:26px;text-align:center}
.vd .tt .cr{width:44px;height:44px;font-size:14px}
.vd .tt span.vs{color:var(--mut);font-size:16px}
.vd .meta{text-align:center;color:var(--mut);font-size:13px}
.vd .big{text-align:center}
.vd .big small{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.vd .big b{font-family:var(--f-d);font-weight:800;font-size:46px;line-height:1.05;color:var(--flash)}
.gauge{height:10px;background:#1a2440;border-radius:6px;overflow:hidden}
.gauge i{display:block;height:100%;width:68%;background:linear-gradient(90deg,#1c9d56,var(--ok))}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.gl b{color:var(--ok);font-family:var(--f-d);font-size:20px}
.pb{display:grid;gap:8px}
.pb .row{display:grid;grid-template-columns:78px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.pb .tk{height:9px;background:#1a2440;border-radius:5px;overflow:hidden}
.pb .tk i{display:block;height:100%;border-radius:5px}
.pb .row b{text-align:right;font-family:var(--f-d);font-size:17px}
.an p{color:#d3daf0;max-width:68ch;margin-top:8px}
.ai{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:var(--cy);border:1px solid #1c4a58;border-radius:6px;padding:2px 8px;background:#0b1e27}
.kp{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.kp li{display:flex;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.kp li::before{content:"⚡";color:var(--flash)}
.h2h{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.h2h td,.h2h th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.h2h th{color:var(--mut);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.h2h td:last-child{text-align:right;font-family:var(--f-d);font-weight:700;font-size:16px}
.sh{display:flex;gap:8px;flex-wrap:wrap}
.sh a{font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;text-decoration:none;border:1px solid var(--line);background:var(--s2)}
.sh a.wa{background:#12391f;border-color:#1d6b38;color:#9ff0bd}
.vote{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.vote button{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-family:var(--f-d);font-weight:700;font-size:18px}
.vote button small{display:block;font-family:var(--f-b);font-weight:400;font-size:11px;color:var(--mut)}
.vote button:hover{border-color:var(--flash)}

/* bilan */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);display:block}
.kpi b{font-family:var(--f-d);font-size:36px;font-weight:800;line-height:1.1}
.kpi b.g{color:var(--ok)} .kpi b.y{color:var(--flash)} .kpi b.r{color:var(--ko)}
.hb{display:grid;gap:9px;margin-top:10px}
.hb .row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 74px;gap:10px;align-items:center;font-size:13px}
.hb .tk{height:10px;background:#1a2440;border-radius:5px;overflow:hidden}
.hb .tk i{display:block;height:100%;background:var(--ok);border-radius:5px}
.hb .row span:last-child{text-align:right;color:var(--mut);font-size:12px}
.res{display:grid;gap:6px;margin-top:8px}
.res div{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px}
.res .ok{color:var(--ok)}.res .ko{color:var(--ko)}
.res em{font-style:normal;color:var(--mut);font-size:12px}
.spark{width:100%;height:auto;display:block}

/* onglets de revue */
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.rev h2{font-size:30px;font-weight:800;line-height:1.1;margin-bottom:6px}
.rev h3{font-size:21px;margin-bottom:8px}
.rev p,.rev li{color:#c9d2ec;font-size:14.5px}
.rev ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.lead{max-width:70ch;color:var(--mut);margin-bottom:16px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--s2);color:var(--mut);white-space:nowrap}
.pill.g{color:var(--ok);border-color:#1c6a42;background:#0c2418}
.pill.y{color:var(--flash);border-color:#5a4e0a;background:#211c05}
.pill.r{color:var(--ko);border-color:#6b2a2d;background:#26100f}
.pill.c{color:var(--cy);border-color:#1c4a58;background:#0b1e27}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);background:var(--s1);font-weight:500}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{font-weight:600;color:var(--tx)}
.wire{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;align-items:start}
.ph{border:1px solid var(--line);border-radius:22px;background:var(--bg);padding:12px;display:grid;gap:7px;max-width:330px;margin-inline:auto;width:100%}
.ph .w{background:var(--s2);border-radius:7px;height:18px}
.ph .wc{background:var(--s1);border:1px solid var(--line);border-radius:8px;height:62px}
