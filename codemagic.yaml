workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - offerwall_keys
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.afrotok.afrotok
    integrations:
      app_store_connect: Afrolook
    scripts:
      - name: Disable Flutter Swift Package Manager
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Pod install
        # GitHub répond parfois 503 / 504 quand CocoaPods télécharge un SDK (ex. UnityAds.zip) : jusqu'à 5 essais, 60 s d'attente entre deux ; les SDK déjà téléchargés restent en cache
        script: |
          cd ios
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" = "1" ]; then
              pod install --repo-update && break
            else
              pod install && break
            fi
            if [ "$attempt" = "5" ]; then
              echo "pod install a échoué 5 fois de suite"
              exit 1
            fi
            echo "Téléchargement impossible (essai $attempt sur 5) : nouvelle tentative dans 60 s…"
            sleep 60
          done
      - name: Set up Xcode signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "6811423047") + 1))
          cd ios
          agvtool new-version -all $BUILD_NUMBER
      - name: Créer le fichier de clé des tâches (Tapjoy iPhone)
        # assets/env/*.env sont ignorés par Git (clés non versionnées) : on recrée ici celui de Tapjoy (clé iPhone) à partir de la variable sécurisée TAPJOY_SDK_KEY_IOS du groupe « offerwall_keys » (Codemagic ne sert que pour iOS ; ayeT n'est pas dans la version iPhone)
        script: |
          mkdir -p assets/env
          echo "TAPJOY_SDK_KEY_IOS=$TAPJOY_SDK_KEY_IOS" > assets/env/tapjoy.env
      - name: Build iOS release
        script: |
          flutter build ipa --release --analyze-size \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Pas de soumission automatique à la revue bêta : elle échoue (422) quand un autre build de la même version est déjà en revue.
        # Le build est envoyé sur TestFlight ; le groupe interne « Testeurs interne » le reçoit tout seul (distribution automatique),
        # donc pas de beta_groups ici : Codemagic ne peut pas ajouter un groupe interne à la main (erreur « Cannot add internal group to a build »).
        # L'envoi en production se fait depuis App Store Connect.
        submit_to_testflight: false
      email:
        recipients:
          - techbienos@gmail.com
        notify:
          success: true
          failure: true
