const PERIODS = { '7': { n: 7, unit: 'jour' }, '30': { n: 30, unit: 'jour' }, '90': { n: 90, unit: 'jour' }, '12': { n: 12, unit: 'mois' } };

  const R = rng(key.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7)); const m = p.unit === 'mois' ? 30 : 1;
  return Array.from({ length: p.n }, (_, i) => { const t = i / (p.n - 1 || 1); const dow = (p.n - 1 - i) % 7; const wk = p.unit === 'jour' ? [1, 1.05, 1.0, 1.08, 1.2, 1.35, 1.15][dow] : 1; const spike = p.unit === 'jour' && p.n >= 30 && i === Math.floor(p.n * .62) ? 1.9 : 1;
    return Math.max(1, Math.round(m * base * wk * spike * (1 + growth * t) * (1 + (R() - .5) * amp))); });
}

/* ——— Graphiques SVG ——— */
const W = 640, H = 230, PL = 42, PR = 10, PT = 12, PB = 26;
function niceMax(v) { const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }
function grid(max) { let g = ''; for (let i = 0; i <= 4; i++) { const y = PT + (H - PT - PB) * (1 - i / 4); g += `<line x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${PL - 6}" y="${y + 3}" text-anchor="end">${short(max * i / 4)}</text>`; } return g; }
function xlabels(labels, X) { const n = labels.length; const step = Math.max(1, Math.ceil(n / 7)); let g = ''; labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${l}</text>`; }); return g; }
function lineChart(id, labels, S) {
  const max = niceMax(Math.max(...S.flatMap((s) => s.data)) * 1.02); const n = labels.length;
  const X = (i) => PL + (W - PL - PR) * (n === 1 ? .5 : i / (n - 1)); const Y = (v) => PT + (H - PT - PB) * (1 - v / max);

  return mount(id, body, labels, S, X, n);
}
function barChart(id, labels, data, avg, color, name) {
  const max = niceMax(Math.max(...data) * 1.05); const n = data.length; const slot = (W - PL - PR) / n; const bw = Math.max(2, slot * .66);

  <section class="kpis"><div class="card kpi"><div class="l">Annonces actives</div><div class="v">${a.ads}</div></div><div class="card kpi"><div class="l">Affichages (30 j)</div><div class="v">${short(a.views)}</div></div><div class="card kpi"><div class="l">Clics (30 j)</div><div class="v">${short(a.clicks)}</div><div class="s">jamais montrés au public</div></div><div class="card kpi"><div class="l">Taux de clic</div><div class="v">${ctr(a)}</div></div>${a.spent ? `<div class="card kpi"><div class="l">Dépensé</div><div class="v">${F(a.spent)}</div><div class="s">frais de paiement à sa charge</div></div>` : ''}</section>
  <section class="grid2"><div class="card"><div class="bar"><h3>Évolution</h3>${seg('evop', [['30', '30 j'], ['90', '90 j'], ['12', '12 mois']], state.evoP)}</div><div class="legend"><span><i style="background:var(--c1)"></i>Affichages</span><span><i style="background:var(--c3)"></i>Clics</span></div>${lineChart('c-evo', labels, [{ name: 'Affichages', color: 'var(--c1)', data: sh, area: true }, { name: 'Clics', color: 'var(--c3)', data: cl }])}</div>
    <div class="card"><h3>Respect du ciblage</h3><p class="sub">Part des affichages hors des pays visés. Limite : 40 %.</p><div class="meter" role="img" aria-label="${out} % hors pays visés"><i style="width:${out / 40 * 100}%"></i></div><p class="sub" style="margin-top:6px"><b style="color:var(--fg)">${out} %</b> hors pays visés (maximum 40 %)</p>
      <h3 style="margin-top:14px">Pays visés</h3><div class="same"><span>${a.country}</span><span>Côte d’Ivoire</span><span>Sénégal</span></div></div></section>
  <section class="card"><h3>Ses annonces</h3><div class="tblw"><table class="tbl"><thead><tr><th>Titre</th><th>Format</th><th>Statut</th><th class="num">Jours restants</th><th class="num">Affichages</th><th class="num">Clics</th></tr></thead><tbody>${mine.map((m) => `<tr><td><b>${m[0]}</b></td><td>${m[1]}</td><td>${statusBadge(m[2] === 'En ligne' ? 'Validé' : m[2])}</td><td class="num">${m[3] || '—'}</td><td class="num">${fmt(m[4])}</td><td class="num">${fmt(m[5])}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ——— 4. Diffuseurs ——— */
function pubList() {
  const list = [...P].sort((a, b) => state.pubBy === 'shows' ? b.shows - a.shows : b.gains - a.gains);
  return `${head('Diffuseurs', 'Les sites et applications qui affichent des annonces, et ce qu’ils gagnent.', seg('pubby', [['shows', 'Affichages'], ['gains', 'Gains']], state.pubBy))}${demoNote}
  <section class="card"><div class="tblw"><table class="tbl"><thead><tr><th>Diffuseur</th><th>Type</th><th class="num">Sites / apps</th><th class="num">Affichages valides (30 j)</th><th class="num">Gains (65 %)</th><th class="num">À payer après retenue</th><th>Statut</th></tr></thead><tbody>
  ${list.map((d) => `<tr class="row" tabindex="0" role="link" data-open="pub:${d.id}" aria-label="Ouvrir la fiche de ${d.name}"><td><div class="who"><span class="av sq" style="background:${d.color}">${d.name[0]}</span><b>${d.name}</b></div></td><td>${d.kind}</td><td class="num">${d.props}</td><td class="num"><b>${fmt(d.shows)}</b></td><td class="num">${F(d.gains)}</td><td class="num">${F(d.due)}</td><td>${statusBadge(d.status)}</td></tr>`).join('')}</tbody></table></div></section>`;
}
function pubFiche(d) {
  const p = PERIODS[state.evoP]; const labels = labelsOf(p); const sh = series(d.name + state.evoP, p, Math.max(1, d.shows / 30), .25, .35); const gn = sh.map((v) => Math.round(v * (d.gains / Math.max(1, d.shows))));
  const props = d.kind === 'Site' ? ['togo-actu.com', 'togo-actu.com/sport', 'm.togo-actu.com'].slice(0, d.props) : [d.name + ' (Android)', d.name + ' (iPhone)'].slice(0, d.props + 1);
  return `<button class="back" type="button" data-back>← Retour aux diffuseurs</button>
  <section class="card"><div class="prof"><span class="av sq" style="background:${d.color}">${d.name[0]}</span><div style="flex:1;min-width:200px"><h2>${d.name} ${statusBadge(d.status)}</h2><div class="meta"><span>Identifiant : <b>ap_${d.id}k9x2m4</b></span><span>Type : <b>${d.kind}</b></span><span>Règles acceptées : <b>version 3</b></span><span>Retrait minimum : <b>10 000 F</b></span></div></div><span class="lock">🔒 Consultation seule</span></div></section>
  <section class="kpis"><div class="card kpi"><div class="l">Affichages valides (30 j)</div><div class="v">${short(d.shows)}</div></div><div class="card kpi"><div class="l">Gains (65 %)</div><div class="v">${F(d.gains)}</div><div class="s">sur 30 jours</div></div><div class="card kpi"><div class="l">Retenue en cours</div><div class="v">${F(d.gains - d.due)}</div><div class="s">libérée après 30 jours</div></div><div class="card kpi"><div class="l">Disponible au retrait</div><div class="v">${F(d.due)}</div><div class="s">${d.due >= 10000 ? 'au-dessus du minimum' : 'sous le minimum'}</div></div></section>
  <section class="grid2"><div class="card"><div class="bar"><h3>Évolution</h3>${seg('evop', [['30', '30 j'], ['90', '90 j'], ['12', '12 mois']], state.evoP)}</div><div class="legend"><span><i style="background:var(--c1)"></i>Affichages valides</span><span><i style="background:var(--c3)"></i>Gains (F)</span></div>${lineChart('c-evo', labels, [{ name: 'Affichages valides', color: 'var(--c1)', data: sh, area: true }, { name: 'Gains (F)', color: 'var(--c3)', data: gn }])}</div>
    <div class="card"><h3>Sites et applications</h3><p class="sub">Preuve de propriété vérifiée.</p><div class="list">${props.map((x) => `<div class="it"><span>${x}</span><span class="up">✓ vérifié</span></div>`).join('')}</div>
      <h3 style="margin-top:14px">Catégories acceptées</h3><div class="same"><span>Mode</span><span>Banque</span><span>Télécoms</span><span>Éducation</span></div></div></section>
  <section class="card"><h3>Dernières demandes de retrait</h3><p class="sub">Historique en lecture seule : les décisions de paiement se prennent dans la file de retraits.</p><div class="list"><div class="it"><span>Retrait du 28 oct.<br><small style="color:var(--muted)">Mobile Money</small></span><span>${F(Math.round(d.due * .8))} · payé</span></div><div class="it"><span>Retrait du 12 oct.<br><small style="color:var(--muted)">Mobile Money</small></span><span>${F(Math.round(d.due * .6))} · payé</span></div></div></section>`;
}

/* ——— 5. Assemblage : comment tout se combine ——— */
function plan() {
  const Q = [
    ['Où l’afficher ?', [['site', 'Sur le site d’administration (écran large, recommandé)'], ['app', 'Aussi dans l’application, à côté du tableau de bord actuel']]],
    ['Comment combiner les trois', [['one', 'Un seul panneau, un menu en haut : Vue d’ensemble, Utilisateurs, Annonceurs, Diffuseurs (comme cette maquette)'], ['keep', 'Garder les espaces annonceur et diffuseur actuels tels quels, sans les toucher'], ['kit', 'Les rebâtir avec les mêmes briques visuelles, quand on y touchera']]],
    ['Top utilisateurs', [['both', 'Vues 30 jours ET depuis toujours, avec un bouton (comme la maquette)'], ['v30', 'Seulement les 30 derniers jours']]],
    ['Ce que l’équipe voit sur une fiche', [['money', 'Soldes en pièces et en argent, et vues à encaisser (permission finance)'], ['mask', 'E-mail et téléphone masqués par défaut'], ['log', 'Chaque ouverture de fiche notée dans un journal']]],
    ['En plus', [['csv', 'Export CSV des inscriptions (sans données privées)'], ['alert', 'Alerte si les inscriptions chutent ou explosent d’un coup'], ['cohort', 'Courbe de rétention (qui revient après 1, 7, 30 jours)']]],
  ];
  return `${head('Comment tout s’assemble', 'Trois espaces existent ou existeront : ils partagent les mêmes briques et les mêmes données, seul ce qu’on y voit change.')}
  <section class="roles">
    <div class="rc adm"><h4>👁 Administration (cette maquette)</h4><ul><li>Voit tout : utilisateurs, annonceurs, diffuseurs</li><li>Consultation seule, aucune opération</li><li>Les décisions (valider, payer) restent dans leurs écrans actuels</li></ul></div>
    <div class="rc"><h4>📣 Espace annonceur</h4><ul><li>Existe déjà sur le site d’Afrolook Ads</li><li>Ne voit que ses propres annonces</li><li>Reprendrait la fiche annonceur ci-dessus</li></ul></div>
    <div class="rc"><h4>🌐 Espace diffuseur</h4><ul><li>Existe déjà sur le site d’Afrolook Ads</li><li>Ne voit que ses propres sites et gains</li><li>Reprendrait la fiche diffuseur ci-dessus</li></ul></div>
  </section>
  <section class="card"><h3>Mêmes briques partout</h3><p class="sub">Un seul jeu de composants, aux couleurs du site : vert de marque pour les actions et les courbes, jaune seulement en fond (boutons, pastilles) avec texte noir, ambre foncé quand un texte doit être « jaune », rouge réservé aux alertes, filet vert-jaune-rouge sous l’en-tête. Thème clair et sombre.</p>
    <div class="same"><span>Cartes de chiffres</span><span>Courbes et barres</span><span>Anneaux</span><span>Tableaux cliquables</span><span>Fiches en lecture seule</span><span>Périodes 7 j · 30 j · 90 j · 12 mois</span></div>
    <div class="note" style="margin-top:12px"><b>Règles de la régie respectées :</b> on écrit « Afrolook Ads » ; les clics ne sont jamais montrés au public (ici, seulement à l’équipe et à l’annonceur) ; on montre « 65 % reçus » par le diffuseur, jamais ce que garde Afrolook Ads ; rien sur la commission de l’application.</div></section>
  <section class="card q"><h3>À valider avant de construire</h3><p class="sub" style="margin:0">Cochez ce que vous voulez, puis copiez votre choix. Rien n’est construit avant votre accord.</p>
    ${Q.map(([t, o], qi) => `<div class="opt"><h4>${t}</h4>${o.map(([k, l]) => `<label class="chk"><input type="checkbox" data-q="${qi}:${k}" data-label="${l.replace(/"/g, '&quot;')}" ${(qi === 0 && k === 'site') || (qi === 1 && k === 'one') || (qi === 2 && k === 'both') || qi === 3 ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>`).join('')}
    <button class="copy" type="button" id="copy">Copier mon choix</button><pre id="out" aria-live="polite"></pre></section>`;
}

/* ——— Affichage et événements ——— */
const TABS = [['over', 'Vue d’ensemble', 'vue'], ['users', 'Utilisateurs', 'utilisateurs'], ['adv', 'Annonceurs', 'annonceurs'], ['pub', 'Diffuseurs', 'diffuseurs'], ['plan', 'Assemblage', 'assemblage']];
function render() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button type="button" data-tab="${k}" ${state.tab === k ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  let html;
  if (state.detail) { const [k, id] = state.detail.split(':'); html = k === 'user' ? userFiche(U.find((x) => x.id == id)) : k === 'adv' ? advFiche(A.find((x) => x.id == id)) : pubFiche(P.find((x) => x.id == id)); }
  else html = { over, users, adv: advList, pub: pubList, plan }[state.tab]();
  document.getElementById('app').innerHTML = html;
  const h = state.detail ? '#fiche' : '#' + TABS.find((t) => t[0] === state.tab)[2]; if (location.hash !== h) history.replaceState(null, '', h);
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-period],[data-topby],[data-topwin],[data-evo],[data-evop],[data-advby],[data-pubby],[data-open],[data-back],#copy,#theme'); if (!t) return; const y = window.scrollY; const d = t.dataset;
  if (t.id === 'theme') { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; return; }
  if (t.id === 'copy') { const lines = []; document.querySelectorAll('[data-q]:checked').forEach((c) => lines.push('• ' + c.dataset.label)); const out = document.getElementById('out'); const txt = 'Administration Afrolook — mes choix :\n' + (lines.join('\n') || '(rien coché)'); out.textContent = txt; out.style.display = 'block';
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { t.textContent = 'Copié ✓'; }).catch(() => { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Texte sélectionné : copiez-le'; }); return; }
  if (d.tab) { state.tab = d.tab; state.detail = null; scrollTo(0, 0); render(); return; }
  if (d.open) { state.detail = d.open; state.evo = 'views'; state.evoP = '90'; scrollTo(0, 0); render(); return; }
  if ('back' in d) { state.detail = null; render(); return; }
  if (d.period) state.period = d.period; else if (d.topby) state.topBy = d.topby; else if (d.topwin) state.topWin = d.topwin; else if (d.evo) state.evo = d.evo; else if (d.evop) state.evoP = d.evop; else if (d.advby) state.advBy = d.advby; else if (d.pubby) state.pubBy = d.pubby;
  const checks = [...document.querySelectorAll('[data-q]')].map((c) => c.checked); render(); document.querySelectorAll('[data-q]').forEach((c, i) => { c.checked = checks[i]; }); scrollTo(0, y);
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row')) { e.preventDefault(); e.target.click(); } });
addEventListener('hashchange', () => { const t = TABS.find((x) => '#' + x[2] === location.hash); if (t && (state.tab !== t[0] || state.detail)) { state.tab = t[0]; state.detail = null; render(); } });
(() => { const t = TABS.find((x) => '#' + x[2] === location.hash); if (t) state.tab = t[0]; })();
render();
</script>
